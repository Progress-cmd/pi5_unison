<VirtualHost *:80>
    ServerName unison.pi5.ovh
    DocumentRoot /var/www/html/src

    <Directory /var/www/html/src>
        # Pas d'Indexes : sans ça, tout dossier sans index.php expose son listing.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Les inclusions ne doivent jamais être servies directement.
    <DirectoryMatch "^/var/www/html/src/includes">
        Require all denied
    </DirectoryMatch>

    # En-têtes de sécurité (mod_headers est activé dans le Dockerfile)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
