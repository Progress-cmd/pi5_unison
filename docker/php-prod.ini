; --- DISSIMULATION ---
expose_php = Off

; --- GESTION DES ERREURS ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- SÉCURITÉ DES SESSIONS ---
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_only_cookies = 1
session.use_strict_mode = 1

; --- PERFORMANCES & LIMITES ---
opcache.enable = 1
; validate_timestamps = 0 fige le code compilé jusqu'au redémarrage du
; conteneur : après un « git pull », Apache continue de servir l'ancienne
; version, même rechargé en gracieux. Sur une application à deux utilisateurs,
; le gain de performance ne vaut pas ce piège de déploiement.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
memory_limit = 256M
max_execution_time = 300

; --- MAIL ---
SMTP = ml
smtp_port = 587
sendmail_path = "/usr/sbin/sendmail -t -i"