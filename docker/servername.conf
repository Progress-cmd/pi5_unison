# Nom du serveur, au niveau GLOBAL.
#
# Sans cette ligne, Apache émet à chaque démarrage et à chaque rechargement :
#
#   AH00558: apache2: Could not reliably determine the server's fully qualified
#   domain name, using 172.19.0.4. Set the 'ServerName' directive globally to
#   suppress this message
#
# Le ServerName de docker/000-default.conf ne suffit pas : il vit dans le
# <VirtualHost>, alors que l'avertissement porte sur la configuration globale,
# celle qu'Apache lit avant tout hôte virtuel. Il faut donc le déclarer ici, à
# la racine de la configuration.
#
# POURQUOI « localhost » ET NON « unison.pi5.ovh »
# ------------------------------------------------
# Apache tourne avec UseCanonicalName Off par défaut : les URL qu'il fabrique
# lui-même (redirections, DirectorySlash) reprennent l'en-tête Host envoyé par
# le client, pas ce ServerName. Celui-ci ne sert donc qu'à répondre à la
# question « quel est mon nom ? » quand personne ne la pose vraiment.
#
# Y mettre le nom public serait trompeur : le conteneur est joignable par
# plusieurs chemins — unison.pi5.ovh derrière Traefik, localhost:8082 en
# développement, l'IP du réseau Docker entre conteneurs. « localhost » est le
# seul nom vrai dans tous ces cas, et ne fige aucun domaine dans l'image.
#
# L'hôte virtuel de docker/000-default.conf continue, lui, de porter le nom
# public : c'est là qu'il a un sens.

ServerName localhost
