<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 62" role="img" aria-label="Unison">
    <!--
        Marque de l'interface : barre latérale et page de connexion.

        Sans tuile, contrairement au favicon : elle se pose à l'intérieur de
        l'application, sur une surface qui a déjà sa couleur. Les teintes
        suivent donc le thème — un bleu profond devenait presque noir sur la
        barre latérale en mode sombre. Une SVG chargée par <img> honore
        prefers-color-scheme, ce qui évite de maintenir deux fichiers.

        Trait fin, accordé à celui de l'icône.
    -->
    <style>
        .orange { stroke: #c8593a; }
        .bleu   { stroke: #0583ab; }

        @media (prefers-color-scheme: dark) {
            .orange { stroke: #e0785c; }
            .bleu   { stroke: #2ba7ce; }
        }
    </style>
    <g fill="none" stroke-width="5.4">
        <circle class="orange" cx="32" cy="31" r="27"/>
        <circle class="bleu"   cx="68" cy="31" r="27"/>
    </g>
</svg>
