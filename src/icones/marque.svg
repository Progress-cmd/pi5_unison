<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 62" role="img" aria-label="Unison">
    <!--
        Deux anneaux qui se chevauchent : le même motif que les cercles de
        présence de l'en-tête, et que l'icône de l'application.

        Fond transparent et tracé vectoriel, pour se poser aussi bien sur la
        carte blanche de la connexion que sur la barre latérale, en clair
        comme en sombre. Trait épais et fort chevauchement : c'est ce qui
        garde le motif lisible une fois réduit à 22 px de haut.
    -->
    <g fill="none" stroke-width="8">
        <circle cx="32" cy="31" r="27" stroke="#c8593a"/>
        <circle cx="68" cy="31" r="27" stroke="#0583ab"/>
    </g>
</svg>
