<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Unison">
    <!--
        Favicon : la même tuile claire à coins arrondis que l'icône de
        l'application, pour que l'onglet, la barre de titre et le lanceur
        montrent le même objet.

        Plus de variante sombre : la tuile crème donne un fond constant, donc
        les anneaux n'ont pas à changer de teinte selon le thème du système.

        Trait un peu plus épais que sur les grandes tailles — c'est du réglage
        optique : un même trait relatif ne se lit pas pareil sur 512 px et
        sur 16.
    -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#f8f7f5"/>
    <g fill="none" stroke-width="5.9">
        <circle cx="33.5" cy="50" r="23.5" stroke="#c8593a"/>
        <circle cx="66.5" cy="50" r="23.5" stroke="#0583ab"/>
    </g>
</svg>
